name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: redflag_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: redflag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redflag_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://redflag_user:ci_password@localhost:5432/redflag
      OPENAI_API_KEY: "sk-test-dummy"

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest
